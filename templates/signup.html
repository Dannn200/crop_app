{% extends "base.html" %}
{% block title %}Sign up — Crop Advisor{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px; margin:0 auto;">
  <h2>🌾 Create Account</h2>
  <p class="tagline">AI-powered insights for modern farming</p>
  <p class="subtitle">Register a new account to get started.</p>
  <form method="POST">
    <label for="signup-username">Username</label>
    <input type="text" id="signup-username" name="username" placeholder="Choose a username" required>
    <label for="signup-password">Password</label>
    <input type="password" id="signup-password" name="password" placeholder="Choose a password" required>
    <button type="submit" class="btn-full">Sign Up</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <p class="muted" style="margin-top: 20px; text-align: center;">
    Already have an account? <a href="{{ url_for('login') }}">Log in</a>
  </p>
</div>
{% endblock %}
